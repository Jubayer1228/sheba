# Build and deploy Sheba API + web to Cloud Run (Artifact Registry in same region).
substitutions:
  _REGION: us-central1
  _API_SERVICE: sheba-api
  _WEB_SERVICE: sheba-web
  _REPO: sheba

options:
  logging: CLOUD_LOGGING_ONLY

steps:
  - id: ensure-repo
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: bash
    args:
      - -c
      - |
        gcloud artifacts repositories describe ${_REPO} --location=${_REGION} \
          || gcloud artifacts repositories create ${_REPO} \
            --repository-format=docker --location=${_REGION} --description="Sheba images"

  - id: build-api
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_API_SERVICE}:$BUILD_ID
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_API_SERVICE}:latest
      - -f
      - backend/Dockerfile
      - backend

  - id: push-api
    name: gcr.io/cloud-builders/docker
    args:
      - push
      - --all-tags
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_API_SERVICE}

  - id: deploy-api
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_API_SERVICE}
      - --image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_API_SERVICE}:$BUILD_ID
      - --region=${_REGION}
      - --platform=managed
      - --allow-unauthenticated
      - --port=8080
      - --memory=512Mi
      - --cpu=1
      - --timeout=3600
      - --max-instances=3
      - --set-env-vars=GIN_MODE=release,DATABASE_PATH=/tmp/sheba.db,UPLOAD_DIR=/tmp/uploads

  - id: api-url
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: bash
    args:
      - -c
      - |
        gcloud run services describe ${_API_SERVICE} --region=${_REGION} --format='value(status.url)' > /workspace/api_url.txt

  - id: build-web
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_WEB_SERVICE}:$BUILD_ID
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_WEB_SERVICE}:latest
      - -f
      - deploy/Dockerfile.web
      - .

  - id: push-web
    name: gcr.io/cloud-builders/docker
    args:
      - push
      - --all-tags
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_WEB_SERVICE}

  - id: deploy-web
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: bash
    args:
      - -c
      - |
        API_URL=$(cat /workspace/api_url.txt)
        gcloud run deploy ${_WEB_SERVICE} \
          --image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_WEB_SERVICE}:$BUILD_ID \
          --region=${_REGION} \
          --platform=managed \
          --allow-unauthenticated \
          --port=8080 \
          --memory=256Mi \
          --set-env-vars=BACKEND_URL="$$API_URL"
        WEB_URL=$(gcloud run services describe ${_WEB_SERVICE} --region=${_REGION} --format='value(status.url)')
        gcloud run services update ${_API_SERVICE} \
          --region=${_REGION} \
          --update-env-vars=CORS_ORIGIN="$$WEB_URL"
        echo "API: $$API_URL"
        echo "WEB: $$WEB_URL"

images:
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_API_SERVICE}:$BUILD_ID
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_WEB_SERVICE}:$BUILD_ID